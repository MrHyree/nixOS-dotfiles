        accordion = false
        accordion_direction = "end"
        border = ""
        enabled = true
        fill = "surface_variant"
        id = "g1"
        members = [ "clock", "date" ]
        opacity = 0.55000001192092896
        padding = 12.0
        radius = 29.0
        widget_spacing = 6

        [[bar.default.capsule_group]]
        accordion = false
        accordion_direction = "end"
        enabled = true
        fill = "surface_variant"
        id = "g2"
        members = [ "notifications", "network", "bluetooth", "volume", "brightness" ]
        opacity = 0.5
        padding = 19.0
        radius = 24.0
        widget_spacing = 10

    [bar.left]
    background_opacity = 0.80000000000000004
    border = "secondary"
    border_width = 0
    capsule = true
    capsule_opacity = 0.5
    center = [ "workspaces" ]
    enabled = false
    end = []
    margin_edge = 0
    margin_ends = 300
    padding = 8
    position = "left"
    radius = 12
    scale = 1.2
    start = []

[desktop_widgets]
schema_version = 2
widget_order = []

    [desktop_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [desktop_widgets.widget]

[dock]
background_opacity = 0.54999998770654202
border_width = 0.5
enabled = true
icon_size = 29
inactive_opacity = 0.99999997764825821
magnification_scale = 1.6500000096857548
main_axis_padding = 25
margin_edge = 6
pinned = [ "code", "vesktop", "org.telegram.desktop" ]
radius = 22
show_dots = true

[hot_corners.top_left]
action = "control_center"

[location]
auto_locate = true

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [ "lockscreen-login-box@eDP-1" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@eDP-1"]
    box_height = 196.0
    box_width = 810.0
    cx = 960.0
    cy = 898.0
    output = "eDP-1"
    placement_height = 1080.0
    placement_width = 1920.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@eDP-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

[osd]
background_opacity = 0.80000000000000004
position = "top_left"
scale = 1.0

    [osd.kinds]
    bluetooth = false
    lock_keys = false
    media = false

[plugins]
enabled = [ "piero-93/battery-power-management", "osp54/oppo-pods", "icefish/phone-connect" ]

[shell]
avatar_path = "/home/hyree/dotfiles/assets/profile.png"
font_family = "Gintronic"
lang = "ru"
panel_anchor_bar = "default"
screen_time_enabled = true

    [shell.launcher]
    pinned = [ "org.telegram.desktop" ]

    [shell.panel]
    clipboard_placement = "attached"
    control_center_placement = "attached"
    control_center_position = "top_center"
    launcher_placement = "attached"
    launcher_position = "bottom_center"
    session_placement = "attached"
    transparency_mode = "glass"
    wallpaper_placement = "attached"

    [shell.screen_corners]
    enabled = true

    [[shell.session.actions]]
    action = "lock"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "1"
    variant = "default"

    [[shell.session.actions]]
    action = "logout"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "2"
    variant = "default"

    [[shell.session.actions]]
    action = "lock_and_suspend"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "3"
    variant = "default"

    [[shell.session.actions]]
    action = "reboot"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "4"
    variant = "default"

    [[shell.session.actions]]
    action = "shutdown"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "5"
    variant = "destructive"

    [[shell.session.actions]]
    action = "command"
    command = "notify-send 'Noctalia' 'Custom session entry'"
    countdown_seconds = 0.0
    enabled = true
    variant = "default"

[theme]
builtin = "Catppuccin"
community_palette = "Oxocarbon"
custom_palette = "Stylix"
mode = "dark"
source = "custom"
wallpaper_scheme = "dysfunctional"

[wallpaper]
directory = "/home/hyree/Pictures/Wallpapers"
enabled = true

    [wallpaper.default]
    path = "/home/hyree/Pictures/Wallpapers/og3wv9.jpeg"

    [wallpaper.last]
    path = "/home/hyree/Pictures/Wallpapers/IMG_20260914_183055_134.png"

    [wallpaper.monitors.eDP-1]
    path = "/home/hyree/Pictures/Wallpapers/IMG_20260914_183055_134.png"

[widget.brightness]
show_label = false

[widget.control-center]
anchor = true
capsule = true
capsule_radius = 16
custom_image_colorize = false
font_scale = 1.49
glyph = "power"
scale = 1.4000000000000001

[widget.cpu]
capsule = true
capsule_padding = 10
capsule_radius = 24
visualization = "graph"

[widget.date]
format = "• {:%d %b}"

[widget.media]
